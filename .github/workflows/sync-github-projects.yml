name: Sync GitHub projects

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - github-projects.config.json
      - scripts/sync-github-projects.mjs
      - .github/workflows/sync-github-projects.yml

permissions:
  contents: write

concurrency:
  group: sync-github-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh project catalog
        run: npm run projects:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate catalog and portfolio
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Commit to main and publish to the default branch
        env:
          PUBLISH_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git diff --quiet -- src/data/github-projects.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/github-projects.json
            git commit -m "chore: sync GitHub projects"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Project catalog is already up to date."
          fi
          if [ "$PUBLISH_BRANCH" != main ]; then
            git push origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          fi
