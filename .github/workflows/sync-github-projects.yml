name: Sync GitHub projects

on:
  schedule:
    - cron: "23 5 * * 0,2-6"
    - cron: "25 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - github-projects.config.json
      - scripts/sync-github-projects.mjs
      - scripts/capture-project-screenshots.mjs
      - src/__tests__/discovery.test.ts
      - .github/workflows/sync-github-projects.yml

permissions:
  contents: write

concurrency:
  group: sync-github-projects
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh project catalog
        run: npm run projects:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real desktop and mobile screenshots
        env:
          CAPTURE_REFRESH: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '25 5 * * 1') && 'all' || '' }}
        run: node scripts/capture-project-screenshots.mjs
      - name: Validate catalog and portfolio
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Publish the catalog on the default branch
        env:
          PUBLISH_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-projects.json src/data/project-screenshots.json public/projects/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync projects and capture real screenshots"
            git pull --rebase origin "$PUBLISH_BRANCH"
            git push origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          else
            echo "Project catalog is already up to date."
          fi
