name: Temporary portfolio mobile PR validation
on:
  push:
    branches: [ui/mobile-native-polish-20261104]
    paths:
      - .github/workflows/mobile-pr-check.yml
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'thembaxx/portfolio-' && github.ref == 'refs/heads/ui/mobile-native-polish-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
